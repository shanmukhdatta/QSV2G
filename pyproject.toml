[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qsv2g-research"
version = "0.1.0"
description = "Reproducible software simulation of quantum-assisted V2G authorization"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "cryptography>=42", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "nbformat>=5"]
pqc = ["pqcrypto>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
