name: QSV2G modular research CI
on:
  push:
    branches: ["main", "refactor/modular-research-package", "publication/evidence-release-2026-11-14"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -r requirements-repro.txt
          python -m pip install -e . --no-deps
      - name: Guard against tracking unpublished LaTeX manuscripts
        run: |
          if git ls-files -- '*.tex' '*.bib' | grep -q .; then
            echo '::error::Manuscript LaTeX source tracked in the current branch'
            git ls-files -- '*.tex' '*.bib'
            exit 1
          fi
      - name: Regression tests and exact core AST parity
        run: |
          python -m pytest -q tests
          python scripts/check_parity.py
      - name: Verify original experimental ZIP archives
        run: python scripts/verify_archived_evidence.py
      - name: Recalculate archived paper claims and figures
        run: python -m qsv2g.evaluation.evidence --out results/generated/paper-evidence
      - name: Real-PQC protocol and all nine bounded studies
        run: |
          python scripts/run_protocol.py --pair AC --operation DISCHARGE --length 9 >/dev/null
          python scripts/reproduce_all.py --out results/generated/ci-smoke
          python -m qsv2g.evaluation.analysis results/generated/ci-smoke
      - name: Preserve execution evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qsv2g-reviewer-evidence
          path: results/generated/
          if-no-files-found: warn
