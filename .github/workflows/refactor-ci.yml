name: Temporary refactor verification
on:
  push:
    branches: ["refactor/modular-research-package"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev,pqc]"
      - name: Regression tests and exact core AST parity
        run: |
          python -m pytest -q tests
          python scripts/check_parity.py
      - name: Real-PQC simulated protocol and research smoke runs
        run: |
          python scripts/run_protocol.py --pair AC --operation DISCHARGE --length 9 >/dev/null
          python scripts/run_experiment.py --study validation
          python scripts/run_experiment.py --study performance
          python scripts/run_experiment.py --study security
          python scripts/run_experiment.py --study noise
          python scripts/run_experiment.py --study availability
          python scripts/run_experiment.py --study security-adversarial
          python scripts/run_experiment.py --study reliability
